<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cenário 3D</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="controls">
    <div id="mainControls">
      <h3>Menu</h3>
      <button id="toggleCamera">Camera: Following Cat</button>
      <button id="customizeButton">Customize Cat</button>
    </div>

    <div id="customizeMenu">
      <h3>Colors</h3>
      <div class="colorControls">
        <label for="bodyColor">Body Color:</label>
        <input type="color" id="bodyColor" value="#171617">

        <label for="eyeColor">Eye Color:</label>
        <input type="color" id="eyeColor" value="#FFFF00">

        <label for="noseColor">Nose Color:</label>
        <input type="color" id="noseColor" value="#DA88A3">

        <label for="tailTipColor">Tail Tip Color:</label>
        <input type="color" id="tailTipColor" value="#E4E4E4">
      </div>

      <h3>Size</h3>
      <div class="sizeControls">
        <label for="bodySize">Body Size:</label>
        <input type="range" id="bodySize" min="0.5" max="2" step="0.1" value="1">

        <label for="headSize">Head Size:</label>
        <input type="range" id="headSize" min="0.5" max="2" step="0.1" value="1">

        <label for="tailSize">Tail Size:</label>
        <input type="range" id="tailSize" min="0.5" max="2" step="0.1" value="1">

        <label for="legsSize">Legs Size:</label>
        <input type="range" id="legsSize" min="0.5" max="2" step="0.1" value="1">
      </div>

      <button id="resetColors">Reset Colors</button>
      <button id="resetSize">Reset Size</button>
      <button id="closeCustomize">Close</button>
    </div>
  </div>

  <div id="fpsDisplay">
    FPS: <span id="fpsValue">0</span>
  </div>

  <canvas id="fpsChart"></canvas>
</body>

</html>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./script.js"></script>
</body>

</html>
