<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cenário 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #ffffff; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Cena e renderizador
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x00CED1);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Câmera
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 3, 5); // Posição inicial da câmera

    // OrbitControls para movimentar a câmera
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(-2, 1, 2); // Foco no gato
    controls.enableDamping = true; // Movimento suave
    controls.dampingFactor = 0.1;
    controls.maxPolarAngle = Math.PI / 2; // Restringir movimento abaixo do chão (opcional)

    // Luz ambiente
    const ambientLight = new THREE.AmbientLight(0xffd6a5, 1);
    scene.add(ambientLight);

    // Luz direcional (de cima)
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(0, 10, 0); // Luz vindo de cima
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    // Gato (material preto)
    const catMaterial = new THREE.MeshStandardMaterial({ color: 0x171617 }); // Cor preta
    const tailMaterial = new THREE.MeshStandardMaterial({ color: 0xE4E4E4 }); // Cor branco escuro
    const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0xFFFF00 }); // Cor amarela
    const pupilMaterial = new THREE.MeshStandardMaterial({ color: 0xC26412 }); // Cor laranja escuro
    const noseMaterial = new THREE.MeshStandardMaterial({ color: 0xDA88A3 }); // Cor laranja escuro

    // Criar o grupo para o gato
    const catGroup = new THREE.Group();

    // Corpo do gato
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 0.4), catMaterial);
    body.position.set(-2, 1, 2);
    body.castShadow = true;
    catGroup.add(body);

    // Cabeça do gato
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), catMaterial);
    head.position.set(-.95, 1.2, 2);
    head.castShadow = true;
    catGroup.add(head);

    // Focinho do gato
    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.3), catMaterial);
    snout.position.set(-.65, 1.1, 2);
    snout.castShadow = true;
    catGroup.add(snout);

    // Orelhas do gato
    const rightEar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.1), catMaterial);
    rightEar.position.set(-1.05, 1.45, 2.15);
    rightEar.castShadow = true;
    catGroup.add(rightEar);

    const leftEar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.1), catMaterial);
    leftEar.position.set(-1.05, 1.45, 1.85);
    leftEar.castShadow = true;
    catGroup.add(leftEar);

    // Pernas do gato
    const rightFrontLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), catMaterial);
    rightFrontLeg.position.set(-1.5, 0.5, 2.12);
    rightFrontLeg.castShadow = true;
    catGroup.add(rightFrontLeg);

    const leftFrontLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), catMaterial);
    leftFrontLeg.position.set(-1.5, 0.5, 1.88);
    leftFrontLeg.castShadow = true;
    catGroup.add(leftFrontLeg);

    const rightBackLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), catMaterial);
    rightBackLeg.position.set(-2.55, 0.5, 2.12);
    rightBackLeg.castShadow = true;
    catGroup.add(rightBackLeg);

    const leftBackLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), catMaterial);
    leftBackLeg.position.set(-2.55, 0.5, 1.88);
    leftBackLeg.castShadow = true;
    catGroup.add(leftBackLeg);

    // Cauda do gato
    const tailBeggining = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.1), catMaterial);
    tailBeggining.position.set(-3.1, 1.05, 2);
    tailBeggining.rotation.z = 25 * Math.PI / 180;
    tailBeggining.castShadow = true;
    catGroup.add(tailBeggining);

    const tailEnding = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.1), catMaterial);
    tailEnding.position.set(-3.75, .88, 2);
    tailEnding.castShadow = true;
    catGroup.add(tailEnding);

    const tailPoint = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.1), tailMaterial);
    tailPoint.position.set(-4.125, .88, 2);
    tailPoint.castShadow = true;
    catGroup.add(tailPoint);

    // Olho esquerdo
    const leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.001, 0.1, 0.1), eyeMaterial);
    leftEye.position.set(-0.70, 1.25, 2.2);
    catGroup.add(leftEye);

    const leftPupil = new THREE.Mesh(new THREE.BoxGeometry(0.001, 0.1, 0.1), pupilMaterial);
    leftPupil.position.set(-0.70, 1.25, 2.1);
    catGroup.add(leftPupil);

    // Olho direito
    const rightEye = new THREE.Mesh(new THREE.BoxGeometry(0.001, 0.1, 0.1), eyeMaterial);
    rightEye.position.set(-0.70, 1.25, 1.8);
    catGroup.add(rightEye);

    const rightPupil = new THREE.Mesh(new THREE.BoxGeometry(0.001, 0.1, 0.1), pupilMaterial);
    rightPupil.position.set(-0.70, 1.25, 1.9);
    catGroup.add(rightPupil);

    // Nariz
    const noseDown = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.1), noseMaterial);
    noseDown.position.set(-0.60, 1.18, 2);
    catGroup.add(noseDown);

    const noseTop = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.1), noseMaterial);
    noseTop.position.set(-0.625, 1.2, 2);
    catGroup.add(noseTop);

    // Adiciona o grupo do gato à cena
    scene.add(catGroup);

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); // Atualiza os controles para suavidade
      renderer.render(scene, camera);
    }
    animate();

    // Ajustar tela
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
